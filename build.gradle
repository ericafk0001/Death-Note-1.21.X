plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.19.4'
	id 'maven-publish'
}

// Stonecutter runs this script once per registered Minecraft version.
version = "${project.mod_version}+${sc.current.version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

def nodeProperty = { String key ->
	def node = sc.properties.raw('versions').find { it['minecraft_version'].toString() == sc.current.project }
	if (node == null) {
		throw new GradleException("No [[versions]] entry for Minecraft '${sc.current.project}' in stonecutter.properties.toml")
	}
	def value = node[key]
	if (value == null) {
		throw new GradleException("Missing '$key' for Minecraft '${sc.current.project}' in stonecutter.properties.toml")
	}
	value.toString()
}

dependencies {
	minecraft "com.mojang:minecraft:${nodeProperty('minecraft_version')}"
	mappings "net.fabricmc:yarn:${nodeProperty('yarn_mappings')}:v2"
	modImplementation "net.fabricmc:fabric-loader:${nodeProperty('loader_version')}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${nodeProperty('fabric_version')}"
}

loom {
	// Share one run directory between all versions.
	runs.configureEach {
		runDirectory = rootProject.file("run")
	}
}

processResources {
	def mcCompat = nodeProperty('mc_compat')
	def loaderVersion = nodeProperty('loader_version')
	def recipeFormat = nodeProperty('recipe_format')
	def recipeFolder = nodeProperty('recipe_folder')

	inputs.property "version", project.version
	inputs.property "minecraft", mcCompat
	inputs.property "loader", loaderVersion
	inputs.property "recipeFormat", recipeFormat
	inputs.property "recipeFolder", recipeFolder

	from(rootProject.file("src/main/recipes/${recipeFormat}")) {
		into "data/deathnote/${recipeFolder}"
	}

	filesMatching("fabric.mod.json") {
		expand(
			version: project.version,
			minecraft: mcCompat,
			loader: loaderVersion
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
