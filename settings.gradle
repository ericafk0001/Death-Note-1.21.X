pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Stonecutter 0.10 requires Gradle 9.7+ and Java 25.
	// See https://stonecutter.kikugie.dev/blog/changes/0.10
	id 'dev.kikugie.stonecutter' version '0.10'
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

def properties = stonecutter.properties

stonecutter {
	// Use Groovy DSL for the controller and build scripts.
	kotlinController = false
	centralScript = 'build.gradle'

	create(getRootProject()) {
		// The whole build matrix lives in stonecutter.properties.toml.
		versions(*properties.raw('versions').collect { it['minecraft_version'].toString() })
		vcsVersion = properties.get('vcs')
	}
}

rootProject.name = 'Death Note'
