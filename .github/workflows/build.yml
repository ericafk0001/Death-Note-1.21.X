name: build
on: [pull_request, push]

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: read version matrix
        id: read
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, tomllib
          with open("stonecutter.properties.toml", "rb") as f:
              matrix = tomllib.load(f)
          print("list=" + json.dumps([node["minecraft_version"] for node in matrix["versions"]]))
          PY

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.versions.outputs.list) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build ${{ matrix.version }}
        run: ./gradlew :${{ matrix.version }}:build
      - name: upload ${{ matrix.version }}
        uses: actions/upload-artifact@v4
        with:
          name: deathnote-${{ matrix.version }}
          path: |
            versions/${{ matrix.version }}/build/libs/*.jar
            !versions/${{ matrix.version }}/build/libs/*-sources.jar
          if-no-files-found: error
